{% extends 'base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="mb-4">Вход в систему</h1>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger">
                        <strong>Ошибка входа:</strong>
                        <p class="mb-0">Неверный email или пароль.</p>
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label">
                        Email
                        {{ form.username }}
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Пароль
                        {{ form.password }}
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>

            <p class="text-center mt-3">
                Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
