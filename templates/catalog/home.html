<div class="card h-100">
    {% if product.image %}
        <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height: 200px; object-fit: cover;">
    {% else %}
        <div class="bg-light d-flex align-items-center justify-content-center" style="height: 200px;">Нет изображения</div>
    {% endif %}
    <div class="card-body">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text text-muted">{{ product.description|truncatewords:15 }}</p>
        <p class="card-text"><strong>Категория:</strong> {{ product.category.name }}</p>
        <p class="card-text text-success fs-5">{{ product.price }} ₽</p>
    </div>
    <div class="card-footer bg-white border-0 d-flex gap-1">
        <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-primary btn-sm flex-fill">Подробнее</a>
        <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-warning btn-sm">✏️</a>
        <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger btn-sm">🗑️</a>
    </div>
</div>
