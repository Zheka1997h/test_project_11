<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма продукта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="mb-4">Форма продукта</h1>

            <form method="post" enctype="multipart/form-data">
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

                <!-- Ошибки формы -->
                <div class="alert alert-danger" style="display: none;" id="form-errors">
                    <strong>Исправьте ошибки:</strong>
                    <ul id="error-list"></ul>
                </div>

                <!-- Название -->
                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <!-- Описание -->
                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea name="description" class="form-control" rows="4"></textarea>
                </div>

                <!-- Категория -->
                <div class="mb-3">
                    <label class="form-label">Категория</label>
                    <select name="category" class="form-control">
                        <option value="">-- Выберите категорию --</option>
                    </select>
                </div>

                <!-- Цена -->
                <div class="mb-3">
                    <label class="form-label">Цена (руб)</label>
                    <input type="number" name="price" class="form-control" step="0.01" required>
                </div>

                <!-- Изображение -->
                <div class="mb-3">
                    <label class="form-label">Изображение (JPEG/PNG, до 5 МБ)</label>
                    <input type="file" name="image" class="form-control" accept="image/jpeg,image/png">
                </div>

                <!-- Кнопки -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <a href="/catalog/products/" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
