{% extends 'base.html' %}
{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="alert alert-danger">
            <h3>Вы уверены, что хотите удалить статью?</h3>
            <p class="fw-bold">"{{ post.title }}"</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-outline-dark">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
