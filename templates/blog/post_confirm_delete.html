{% extends 'base.html' %}
{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-danger">
                <h3>⚠️ Удалить статью?</h3>
                <p class="fw-bold fs-5">"{{ post.title }}"</p>
                <p class="text-muted">Это действие нельзя отменить.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-outline-dark">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
/* Общие стилиg */
